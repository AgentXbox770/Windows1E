<!DOCTYPE html>
<html>
<head>
<title>Windows 1E</title>
<link rel="icon" href="logo.ico">
<style>
  body { margin: 0; background: black; font-family: sans-serif; overflow: hidden; }
  
  #bg-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; transition: filter 0.5s ease, background 0.5s ease;
  }

  #start {
    position: absolute; top: 5px; left: 5px; color: white; background: black;
    border: 1px solid white; padding: 5px 8px; cursor: pointer; z-index: 100;
  }

  #boot, #login-ui { display: none; }
  
  #logo { position: absolute; left: 50%; transform: translateX(-50%); top: 12%; width: 140px; display: none; }
  #spin { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12%; width: 60px; display: none; }
  #text { position: absolute; left: 50%; transform: translateX(-50%); color: white; text-align: center; display: none; font-size: 14px; }

  #clock-container {
    position: absolute; bottom: 50px; left: 50px; color: white;
    transition: transform 0.6s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.5s;
    pointer-events: none;
  }
  .swipe-up { transform: translateY(-100vh); opacity: 0; }

  #login-ui {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: white;
  }
  #pfp { width: 150px; height: 150px; border-radius: 50%; margin-bottom: 30px; object-fit: cover; }
  .login-status { display: flex; align-items: center; justify-content: center; gap: 12px; }
  #login-spin { width: 28px; height: 28px; }

  /* Desktop and Taskbar */
  #desktop {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: none; opacity: 0; transition: opacity 0.8s ease;
    background: url('wallpaper1.png') no-repeat center center;
    background-size: cover;
  }

  #taskbar {
    position: absolute; bottom: 0; width: 100%; height: 40px;
    background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: space-between;
  }

  .taskbar-left { display: flex; align-items: center; height: 100%; }
  
  .tb-icon { height: 100%; padding: 0 12px; display: flex; align-items: center; transition: background 0.2s; }
  .tb-icon img { position: static; transform: none; display: block; width: 20px; height: 20px; }

  /* Hover Effects */
  #start-icon-container:hover { background: rgba(255, 255, 255, 0.1); }
  #start-icon-container:hover img { content: url('hovered_startmenuicon.png'); }
  
  #cortana-container:hover { background: rgba(255, 255, 255, 0.1); }
  #cortana-container:hover img { content: url('hovered_cortana.png'); }

  .taskbar-right {
    color: white; padding-right: 15px; font-size: 12px; text-align: right; line-height: 1.2;
  }

  /* The Cortana Window */
  #cortana-window {
    position: absolute; 
    bottom: 40px; /* Sits right on top of the taskbar */
    left: 0; 
    width: 300px; 
    height: 450px;
    background: #111; 
    border: 1px solid #333; 
    display: none; /* Hidden until you click the icon */
    flex-direction: column; 
    color: white;
    z-index: 5000;
  }
  .win-header { padding: 10px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .win-header img { width: 14px; }
  .win-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
  
  .blue-text { color: #0078d4; font-size: 18px; margin-bottom: 15px; text-align: center; }
  .learn-btn { background: white; color: black; border: none; padding: 10px 20px; cursor: pointer; }

  /* This highlights the icon when clicked */
  .active { background: rgba(255,255,255,0.2) !important; }

#search-container:hover { 
  background: rgba(255, 255, 255, 0.1); 
}

#search-container:hover img { 
  content: url('hovered_search.png'); 
}

/* Windows 10 Style Notification */
#notification {
  position: absolute;
  bottom: 50px; /* Sits just above the taskbar */
  right: -400px; /* Hidden off-screen by default */
  width: 360px;
  background: #1f1f1f;
  border: 1px solid #333;
  color: white;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
  z-index: 9999;
  display: flex;
  gap: 15px;
}

/* Slide-in state */
#notification.show {
  right: 10px;
}

.notif-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}

.notif-icon img {
  width: 100%;
  height: 100%;
  position: static;
  transform: none;
  display: block;
}

.notif-body {
  flex-grow: 1;
}

.notif-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.notif-text {
  font-size: 12px;
  color: #cccccc;
  margin-bottom: 12px;
}

.notif-btn {
  background: #333;
  color: white;
  border: 1px solid #555;
  padding: 6px 24px;
  cursor: pointer;
  font-size: 12px;
  float: right;
}

.notif-btn:hover {
  background: #444;
  border-color: #666;
}


</style>
</head>
<body>

<div id="bg-overlay"></div>
<button id="start">Click to start</button>

<div id="boot">
  <img id="logo" src="logo.png">
  <img id="spin" src="loading_spinner.gif">
  <div id="text">Updates are on your way.<br>Please do not unplug your PC.</div>
</div>

<div id="clock-container"></div>

<div id="login-ui">
  <img id="pfp" src="defaultpfp1.png">
  <div class="login-status">
    <img id="login-spin" src="loading_spinner.gif">
    <span style="font-size: 22px; font-weight: 300;">Preparing Windows</span>
  </div>
</div>

<div id="desktop">

  <!-- Windows 10 Notification Popup (Placed safely inside desktop) -->
  <div id="notification">
    <div class="notif-icon">
      <img src="checkmark_popup.png">
    </div>
    <div class="notif-body">
      <div class="notif-title">New updates installed.</div>
      <div class="notif-text">You are on the latest version of Windows 1E.</div>
      <button class="notif-btn" id="notif-ok">OK</button>
    </div>
  </div>

  <div id="cortana-window">
    <div class="win-header">
      <img src="cortana.png">
      <span>Cortana</span>
    </div>
    <div class="win-content">
      <div class="blue-text">Cortana is no longer supported.</div>
      <button class="learn-btn" onclick="window.open('https://support.microsoft.com/en-us/topic/end-of-support-for-cortana-in-windows-and-microsoft-365-d016911c-6d9b-4654-a31a-e906c278bc2b')">Learn more</button>
    </div>
  </div>

  <div id="taskbar">
    <div class="taskbar-left">
      <div class="tb-icon" id="start-icon-container"><img src="startmenuicon.png"></div>
      <div class="tb-icon" id="search-container"><img src="search.png"></div>
      <div class="tb-icon" id="cortana-container"><img src="cortana.png"></div>
    </div>
    <div class="taskbar-right" id="tb-time"></div>
  </div>

</div>


</body>
<script>
const bg = document.getElementById('bg-overlay');
const clockBox = document.getElementById('clock-container');
const loginUI = document.getElementById('login-ui');
const desktop = document.getElementById('desktop');
const spin = document.getElementById('spin');
const logo = document.getElementById('logo');
const text = document.getElementById('text');

start.onclick = () => {
  start.style.display = "none";
  document.getElementById('boot').style.display = "block";
  setTimeout(() => logo.style.display = "block", 3000);
  setTimeout(() => spin.style.display = "block", 6000);
  setTimeout(() => logo.style.display = "none", 16000);
  setTimeout(() => spin.style.display = "none", 26000);
  setTimeout(() => bg.style.background = "#cc5500", 28000);

  setTimeout(() => {
    spin.style.display = "block";
    spin.style.bottom = "auto"; spin.style.top = "50%"; spin.style.left = "50%";
    spin.style.transform = "translate(-50%, -50%)";
  }, 30000);

  setTimeout(() => {
    text.style.display = "block";
    text.style.top = "calc(50% + 50px)";
  }, 31000);

  setTimeout(() => { text.innerHTML = "No updates found."; }, 34000);

  setTimeout(() => {
    spin.style.display = "none";
    text.style.display = "none";
  }, 35000);

  setTimeout(() => {
    bg.style.background = "url('loginscreenwallpaper1.png') no-repeat center center fixed";
    bg.style.backgroundSize = "cover";
    document.body.style.cursor = "pointer";
    document.body.onclick = swipeUp;
  }, 37000);

  setTimeout(() => {
    updateClock();
    setInterval(updateClock, 1000);
  }, 38000);
};

function updateClock() {
  const now = new Date();
  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  
  clockBox.innerHTML = `
    <div style="font-size:90px; font-weight:100; line-height:1;">
      ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}
    </div>
    <div style="font-size:22px; color:#cccccc; margin-top:10px;">
      ${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}
    </div>
  `;
  
  // Format MM/DD/YYYY for taskbar
  const tbDate = `${(now.getMonth()+1)}/${now.getDate()}/${now.getFullYear()}`;
  const tbTime = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
  document.getElementById('tb-time').innerHTML = `<div>${tbTime}</div><div>${tbDate}</div>`;
}

function swipeUp() {
  document.body.onclick = null;
  document.body.style.cursor = "default";
  clockBox.classList.add('swipe-up');
  bg.style.filter = "blur(30px) brightness(0.7)";
  
  setTimeout(() => { loginUI.style.display = "block"; }, 400);

  // Enter Desktop Phase after 5 seconds
  setTimeout(() => {
    loginUI.style.display = "none";
    desktop.style.display = "block";
    desktop.style.opacity = "0";
    
    setTimeout(() => { 
      desktop.style.opacity = "1"; 
      
      // --- NEW: Trigger notification 3 seconds after desktop is fully visible ---
      setTimeout(() => {
        const notif = document.getElementById('notification');
        notif.classList.add('show');
        
        // Make OK button slide the notification back off-screen
        document.getElementById('notif-ok').onclick = () => {
          notif.classList.remove('show');
        };
      }, 3000);
      
    }, 100);
  }, 5000);
}

let isOpen = false;
const corWindow = document.getElementById('cortana-window');
const corContainer = document.getElementById('cortana-container');
const corImg = corContainer.querySelector('img');

corContainer.onclick = (e) => {
  e.stopPropagation(); // Stop the click from hitting the desktop
  isOpen = !isOpen; // Flip the switch

  if(isOpen) {
    corWindow.style.display = "flex";
    corContainer.classList.add('active');
    corImg.src = "clicked_cortana.png"; // Icon stays highlighted
  } else {
    // Run the close function
    isOpen = false;
    corWindow.style.display = "none";
    corContainer.classList.remove('active');
    corImg.src = "cortana.png"; // Back to normal
  }
};


</script>

</body>
</html>
